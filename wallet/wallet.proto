syntax = "proto3";

package wallet;

option go_package = "github.com/MuhammadMiftaa/Refina-Protobuf/wallet";

service WalletService {
    rpc GetWallets (GetWalletOptions) returns (stream Wallet);
    rpc GetUserWallets (UserID) returns (GetUserWalletsResponse);
    rpc GetWalletByID (WalletID) returns (Wallet);
    rpc CreateWallet (CreateWalletRequest) returns (Wallet);
    rpc UpdateWallet (UpdateWalletRequest) returns (Wallet);
    rpc DeleteWallet (WalletID) returns (Wallet);
    rpc GetWalletTypes (Empty) returns (GetWalletTypesResponse);
    rpc GetWalletSummary (UserID) returns (WalletSummary);

    // ── Admin Master Data RPCs ──
    rpc ListWalletTypes (ListWalletTypesRequest) returns (ListWalletTypesResponse);
    rpc GetWalletTypeDetail (WalletTypeID) returns (WalletTypeDetail);
}

message Empty {}

message Wallet {
    string id = 1;
    string user_id = 2;
    string name = 3;
    string number = 4;
    double balance = 5;
    string wallet_type_id = 6;
    string wallet_type = 7;
    string wallet_type_name = 8;
    string created_at = 9;
    string updated_at = 10;
    int32 transaction_count = 11;
    WalletTypeDetail wallet_type_detail = 12;
    // "asset" or "liability", denormalised from the wallet type.
    string wallet_type_nature = 13;
}

message WalletTypeDetail {
    string id = 1;
    string name = 2;
    string type = 3;
    string description = 4;
    string created_at = 5;
    string updated_at = 6;
    // "asset" for wallets holding money, "liability" for credit lines
    // (credit card, paylater) whose balance is the remaining limit.
    string nature = 7;
    // Public URL of the type's logo. Empty for types created before uploads
    // existed; consumers fall back to the legacy name-derived asset path.
    string icon_url = 8;
}

message WalletID {
    string id = 1;
}

message UserID {
    string id = 1;
}

message GetWalletOptions {
    int32 limit = 1;
}

message CreateWalletRequest {
    string user_id = 1;
    string wallet_type_id = 2;
    string name = 3;
    string number = 4;
    double balance = 5;
}

message UpdateWalletRequest {
    string id = 1;
    string name = 2;
    string number = 3;
    string wallet_type_id = 4;
    double balance = 5;
}

message GetUserWalletsResponse {
    repeated Wallet wallets = 1;
}

message GetWalletTypesResponse {
    repeated WalletTypeDetail wallet_types = 1;
}

message WalletSummary {
    int32 total_wallets = 1;
    // Sum of balances of asset wallets only. Liability wallets are excluded
    // so that net worth is not inflated by unused credit.
    double total_balance = 2;
    int32 total_transactions = 3;
    // Sum of remaining limits across liability wallets (credit cards, paylater).
    double total_credit_available = 4;
}

// ── Admin Master Data Messages ──

message WalletTypeID {
    string id = 1;
}

message ListWalletTypesRequest {
    int32 page = 1;
    int32 page_size = 2;
    string sort_by = 3;
    string sort_order = 4;
    string search = 5;
}

message ListWalletTypesResponse {
    repeated WalletTypeDetail wallet_types = 1;
    int32 total = 2;
    int32 page = 3;
    int32 page_size = 4;
    int32 total_pages = 5;
}